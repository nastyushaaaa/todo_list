name: Development CI

on:
  push:
    branches:
      - development

  pull_request:
    branches:
      - main

jobs:
  test:
    name: Run Python tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Check Python syntax
        run: python -m py_compile main.py

      - name: Run unit tests
        run: python -m unittest -v
